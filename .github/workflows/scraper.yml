name: Downloader

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests py7zr resend python-dotenv beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Configure Git Identity
        run: |
          git config --global user.name "blleng"
          git config --global user.email "lengbl@outlook.com"

      - name: Configure AWS/R2 Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Fetch Script from Cloudflare R2
        run: |
          aws s3 cp s3://economist-scraper/scrape.py ./scrape.py --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

          if [ ! -s scrape.py ]; then
            echo "FATAL: Failed to download scrape.py from R2. File is empty."
            exit 1
          fi

      - name: Verify Script Integrity (SHA-256)
        env:
          EXPECTED_HASH: ${{ secrets.EXPECTED_SCRAPE_HASH }}
        run: |
          echo "Verifying file integrity..."

          ACTUAL_HASH=$(sha256sum scrape.py | awk '{ print $1 }')

          EXPECTED_LOWER=$(echo "$EXPECTED_HASH" | tr '[:upper:]' '[:lower:]')
          ACTUAL_LOWER=$(echo "$ACTUAL_HASH" | tr '[:upper:]' '[:lower:]')

          echo "Expected : $EXPECTED_LOWER"
          echo "Actual   : $ACTUAL_LOWER"

          if [ "$EXPECTED_LOWER" != "$ACTUAL_LOWER" ]; then
            echo "FATAL: Hash mismatch! The script has been tampered with or corrupted during download."
            rm scrape.py
            exit 1
          fi

          echo "Success: Script integrity verified."

      - name: Execute Downloader Script
        env:
          ECONOMIST_REPO_DIR: ${{ github.workspace }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: |
          python scrape.py
