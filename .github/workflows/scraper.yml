name: Downloader

on:
  schedule:
    - cron: '34 15 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests py7zr resend python-dotenv beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Configure Git Identity
        run: |
          git config --global user.name "blleng"
          git config --global user.email "lengbl@outlook.com"

      - name: Execute Downloader Script
        env:
          ECONOMIST_REPO_DIR: ${{ github.workspace }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: |
          python scraper/scrape.py
